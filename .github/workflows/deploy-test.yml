name: Deploy TEST to Linode Ubuntu Server

# Ambiente de pruebas: https://test.biblia.ministeriomenorah.com
# Usa la API de pruebas (https://test.bibliaapi.ministeriomenorah.com), con base de datos separada.

on:
  push:
    branches: [ test ]
  workflow_dispatch:

env:
  TEST_PATH: /WWW/test.biblia.ministeriomenorah.com
  VITE_API_BASE_URL: https://test.bibliaapi.ministeriomenorah.com/api/
  VITE_ENV_LABEL: Pruebas

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Clean and install dependencies
      run: |
        rm -rf node_modules package-lock.json
        npm install

    - name: Build application
      run: npm run build

    - name: Verify build output
      run: |
        test -f dist/index.html || { echo "❌ index.html not found in dist/"; exit 1; }

    - name: Create deployment archive
      run: |
        cd dist
        tar -czf ../deployment.tar.gz .

    - name: Copy files to server
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.LINODE_HOST }}
        username: ${{ secrets.LINODE_USERNAME }}
        key: ${{ secrets.LINODE_SSH_KEY }}
        port: 22
        source: "deployment.tar.gz"
        target: "/tmp/test.biblia-deploy"

    - name: Extract and setup deployment
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.LINODE_HOST }}
        username: ${{ secrets.LINODE_USERNAME }}
        key: ${{ secrets.LINODE_SSH_KEY }}
        port: 22
        script: |
          set -e
          sudo mkdir -p "${{ env.TEST_PATH }}"
          sudo find "${{ env.TEST_PATH }}" -mindepth 1 -delete
          sudo tar -xzf /tmp/test.biblia-deploy/deployment.tar.gz -C "${{ env.TEST_PATH }}"
          rm -rf /tmp/test.biblia-deploy
          sudo chown -R www-data:www-data "${{ env.TEST_PATH }}"
          sudo chmod -R 755 "${{ env.TEST_PATH }}"
          echo "✅ Deployed to ${{ env.TEST_PATH }}"
